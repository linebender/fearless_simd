[package]
name = "simd-research-demo"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["std"]
std = ["simd-research-runtime/std", "simd-research-kernels/std"]
libm = ["simd-research-runtime/libm", "simd-research-kernels/libm"]

[dependencies]
simd-research-macros = { path = "../macros" }
simd-research-kernels = { path = "../kernels", default-features = false }
simd-research-runtime = { path = "../runtime", default-features = false }
